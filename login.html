<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OGA SISTEMVAC - Iniciar Sesión</title>
  <link rel="stylesheet" href="css_login.css">
</head>
<body>

  <header>
    <div class="logo">
      <span class="logo-title">OGA</span>
      <span class="logo-subtitle">SISTEMVAC</span>
    </div>
    <div class="nav-buttons">
      <a href="#" class="btn-outline">Registrarse</a>
    </div>
  </header>

  <!-- Contenido Principal - Formulario de Login -->
  <main>
    <div class="login-card">
      <div class="login-header">
        <h1>ACCESO AL SISTEMA</h1>
        <p>Ingresa tus credenciales para continuar al panel</p>
      </div>

      <!-- Redirección directa a dashboard.html -->
      <form action="dashboard.html" method="GET">
        <div class="form-group">
          <label for="email">Correo Electrónico o Usuario</label>
          <input type="text" id="email" name="email" placeholder="usuario@oga.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" name="remember"> Recordar sesión
          </label>
          <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-primary">Iniciar Sesión</button>
      </form>

      <div class="login-footer">
        ¿No tienes una cuenta? <a href="#">Solicitar acceso</a>
      </div>
    </div>
  </main>

</body>
</html>
